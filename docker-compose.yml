name: gbc-php85
services:
  php85-web:
    build: .
    image: gbc-local/al2023-php85:eb-4.13.13-r2
    container_name: ${CONTAINER_NAME:-web-server-php85}
    privileged: true
    cgroup: host
    command: /sbin/init
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-50085}:80"
      - "${STANDARD_HTTP_PORT:-80}:80"
    volumes:
      - ${DOCKER_VOLUME_DIR:?Set DOCKER_VOLUME_DIR}:/var/www/html:cached
    networks: [mynetwork]
  php85-https:
    image: steveltn/https-portal:1
    container_name: https-portal-php85
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_HTTP_PORT:-50086}:80"
    environment:
      STAGE: local
      DOMAINS: "localhost-gbc-pilot -> http://php85-web:80"
      CLIENT_MAX_BODY_SIZE: 64M
      PROXY_CONNECT_TIMEOUT: 1200
      PROXY_SEND_TIMEOUT: 1200
      PROXY_READ_TIMEOUT: 1200
    volumes:
      - php85-certificates:/var/lib/https-portal
    networks: [mynetwork]
    depends_on: [php85-web]
networks:
  mynetwork:
    name: ${NETWORK_NAME:-local-net}
    external: true
volumes:
  php85-certificates:
