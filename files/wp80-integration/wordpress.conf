# WordPress multisite subdirectory rules.
# Reference: https://www.nginx.com/resources/wiki/start/topics/recipes/wordpress/
# (Note: The similar example provided by WordPress here has a bug.
#  https://wordpress.org/support/article/nginx/#wordpress-multisite-subdirectory-rules)
# This file should work without other configuration.
# This one configuration file is sufficient for both of the main site and sub sites.
# Just put this file in /etc/nginx/config.d, and make sure this file is included by /etc/nginx/nginx.conf.
# If not working, try things blow;
#  - Clear browser cookie and browser cache
#  - Restart PHP-FPM and Nginx

map $uri $blogname{
    ~^(?P<blogpath>/[^/]+/)files/(.*) $blogpath ;
}

map $blogname $blogid{
    default -999;

    #Ref: http://wordpress.org/extend/plugins/nginx-helper/
    #include /var/www/wordpress/wp-content/plugins/nginx-helper/map.conf ;
}

map $http_x_forwarded_proto $wp_integration_https {
    default off;
    https on;
}

server {
    server_name localhost-wp-only1-multi;
    root /var/www/html/wp-only1-multi;
    index index.php;

    # Increase limit for Image upload, and product data import
    client_max_body_size 64M;

    location ~ ^(/[^/]+)?/files/(.+) {
        try_files /wp-content/blogs.dir/$blogid/files/$2 /wp-includes/ms-files.php?file=$2;
        access_log off;
        log_not_found off;
        expires max;
    }

    #avoid php readfile()
    location ^~ /blogs.dir {
        internal;
        alias /var/www/html/wp-only1-multi/wp-content/blogs.dir;
        access_log off;
        log_not_found off;
        expires max;
    }

    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$uri/ permanent;
        rewrite ^(/[^/]+)?(/wp-.*) $2 last;
        rewrite ^(/[^/]+)?(/.*\.php) $2 last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args ;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        # This service has no host ports and is reached through the HTTPS proxy.
        fastcgi_param HTTPS $wp_integration_https;
        fastcgi_intercept_errors on;
        fastcgi_pass unix:/var/run/php-fpm/www.sock;
    }
}
